services:
  db:
    image: postgres:15
    container_name: db_contratos
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: ${DB_PASS}  
      POSTGRES_DB: contratos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: flet_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=contratos_db
      - DB_USER=user_admin
      - DB_PASS=${DB_PASS}           
      - FLET_SERVER_PORT=8080
      - FLET_SERVER_IP=0.0.0.0

volumes:
  postgres_data: